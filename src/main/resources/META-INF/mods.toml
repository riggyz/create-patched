modLoader="javafml"
loaderVersion="${forge_version_range}"
license="LGPL-3.0-or-later"

[[mods]]
modId="${mod_id}"
version="${file.jarVersion}"
displayName="${mod_name}"
description='''
Backports two bugfixes from Create 6.0.9+ to Forge 1.20.1:
1. Schematicannon NBT fix: prevents item duplication with NBT-bearing blocks (e.g. Placards).
2. Train/contraption collision optimisation: eliminates lag spikes when trains enter stations.
'''

[[dependencies.createpatched]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.createpatched]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.createpatched]]
    modId="create"
    mandatory=true
    versionRange="[0.5.1,0.6)"
    ordering="AFTER"
    side="BOTH"
